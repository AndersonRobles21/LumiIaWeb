<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tareas | LUMI</title>
  <link rel="stylesheet" href="../css/global/reset.css">
  <link rel="stylesheet" href="../css/global/variables.css">
  <link rel="stylesheet" href="../css/global/global.css">
  <link rel="stylesheet" href="../css/componentes/sidebar.css">
  <link rel="stylesheet" href="../css/componentes/navbar.css">
  <link rel="stylesheet" href="../css/componentes/botones.css">
  <link rel="stylesheet" href="../css/paginas/tareas.css">
</head>
<body>
  <div class="dashboard-container">
    <aside id="sidebar-container"></aside>
    <div class="dashboard-main">
      <header id="navbar-container"></header>
      <main class="dashboard-content tareas-page">
        <section class="tareas-header">
          <div>
            <p class="eyebrow">GESTIÓN DE ESTUDIO</p>
            <h1>Mis tareas</h1>
            <p>Consulta y actualiza el estado de tus tareas.</p>
          </div>
          <a href="agregar-tarea.html" class="btn-generar-cronograma"><span aria-hidden="true">+</span> Agregar tarea</a>
        </section>
        <nav class="tareas-filtros" aria-label="Filtrar tareas">
          <button type="button" class="filtro activo" data-filtro="todas">Todas</button>
          <button type="button" class="filtro" data-filtro="pendientes">Pendientes</button>
          <button type="button" class="filtro" data-filtro="completadas">Completadas</button>
        </nav>
        <section id="lista-tareas" class="lista-tareas-backend" aria-live="polite">
          <p class="tareas-cargando">Cargando tareas...</p>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="../js/componentes/sidebar.js"></script>
  <script type="module" src="../js/componentes/navbar.js"></script>
  <script type="module" src="../js/paginas/tareas.js?v=todas-eliminar-3"></script>
  <script type="module" src="../js/componentes/tema.js"></script>
</body>
</html>
