<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario | LUMI</title>

  <!-- Estilos globales -->
  <link rel="stylesheet" href="../css/global/reset.css">
  <link rel="stylesheet" href="../css/global/variables.css">
  <link rel="stylesheet" href="../css/global/global.css">

  <!-- Componentes -->
  <link rel="stylesheet" href="../css/componentes/sidebar.css">
  <link rel="stylesheet" href="../css/componentes/navbar.css">
  <link rel="stylesheet" href="../css/componentes/tarjetas.css">
  <link rel="stylesheet" href="../css/componentes/botones.css">

  <!-- Estilos de esta página -->
  <link rel="stylesheet" href="../css/paginas/tareas.css">
</head>
<body>

  <div class="dashboard-container">

    <!-- Sidebar -->
    <aside id="sidebar-container"></aside>

    <!-- Contenido principal -->
    <div class="dashboard-main">

      <!-- Navbar -->
      <header id="navbar-container"></header>

      <!-- Calendario -->
      <main class="dashboard-content">

        <!-- Encabezado de la sección -->
        <section class="tareas-encabezado">
          <div>
            <h1>Calendario</h1>
            <p>Consulta tus tareas por fecha y abre cada detalle.</p>
          </div>
          <a href="agregar-tarea.html" class="boton-principal">
            <span>➕ Nueva tarea inteligente</span>
          </a>
        </section>

        <section class="tareas-filtros">
          <label for="fecha-calendario">Seleccionar día</label>
          <input id="fecha-calendario" type="date">
        </section>

        <!-- Lista de tareas (por ahora vacía / ejemplo) -->
        <section class="tareas-lista" id="lista-tareas">
          <div class="tareas-vacio"><p>Selecciona una fecha para consultar tus tareas.</p></div>
        </section>

      </main>

    </div>

  </div>

  <!-- Scripts -->
  <script type="module" src="../js/componentes/sidebar.js"></script>
  <script type="module" src="../js/componentes/navbar.js"></script>
  <script type="module" src="../js/paginas/calendario.js"></script>

</body>
</html>
