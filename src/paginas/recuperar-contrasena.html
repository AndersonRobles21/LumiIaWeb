<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña | LUMI</title>

  <!-- Rutas corregidas desde src/paginas/ -->
  <link rel="stylesheet" href="../css/global/reset.css">
  <link rel="stylesheet" href="../css/global/variables.css">
  <link rel="stylesheet" href="../css/global/global.css">
  <link rel="stylesheet" href="../css/paginas/recuperar-contraseña.css">
</head>
<body>

  <main class="recuperacion-container">

    <!-- LADO IZQUIERDO: LOGO, MASCOTA Y TEXTO INFORMATIVO -->
    <section class="recuperacion-presentacion">
      
      <div class="lumi-brand">
        <img src="../assets/logo-lumi.png" alt="LUMI Logo" class="lumi-logo-img">
        <p class="lumi-slogan">ESTUDIA <span>MEJOR</span>. LOGRA <span>MAS</span></p>
      </div>

      <div class="mascota-wrapper">
        <!-- Reemplaza la ruta de la imagen según corresponda en tu carpeta assets -->
        <img src="../assets/mascota-contraseña.png" alt="Mascota LUMI con signo de interrogación" class="mascota-lumi">
        
        <div class="badge-informacion">
          <p>Selecciona el método de recuperación de tu contraseña que prefieras</p>
        </div>
      </div>

    </section>

    <!-- LADO DERECHO: OPCIONES DE RECUPERACIÓN -->
    <section class="recuperacion-panel">
      
      <div class="recuperacion-contenido">
        <h1>Elige como quieres<br>recuperar el acceso</h1>

        <div class="metodos-grid">
          
          <!-- Opción 1: Email -->
          <a href="./recuperar-email.html" class="tarjeta-metodo">
            <div class="icono-metodo icono-shield">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
            </div>
            <div class="info-metodo">
              <h2>Codigo de Email</h2>
              <p>Recibe un código en tu email y verifica tu identidad</p>
            </div>
          </a>

          <!-- Opción 2: Huella Dactilar -->
          <button type="button" id="btn-huella" class="tarjeta-metodo">
            <div class="icono-metodo icono-fingerprint">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 11a2 2 0 0 0-2 2v4a2 2 0 0 0 4 0v-4a2 2 0 0 0-2-2z"/>
                <path d="M8 11a6 6 0 0 1 8 0v4a6 6 0 0 1-12 0v-2"/>
                <path d="M5 11a9 9 0 0 1 14 0v6a9 9 0 0 1-18 0"/>
              </svg>
            </div>
            <div class="info-metodo">
              <h2>Huella Dactilar</h2>
              <p>Si tu dispositivo lo permite usa tu huella dactilar para recuperar la contraseña</p>
            </div>
          </button>

        </div>

        <a href="./login.html" class="boton-volver">Volver</a>

      </div>

    </section>

  </main>

  <script type="module" src="../js/paginas/recuperar-contrasena.js"></script>
</body>
</html>
