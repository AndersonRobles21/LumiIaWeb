<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial | LUMI</title>

  <link rel="stylesheet" href="../css/global/reset.css">
  <link rel="stylesheet" href="../css/global/variables.css">
  <link rel="stylesheet" href="../css/global/global.css">
  <link rel="stylesheet" href="../css/componentes/sidebar.css">
  <link rel="stylesheet" href="../css/componentes/navbar.css">
  <link rel="stylesheet" href="../css/componentes/botones.css">
  <link rel="stylesheet" href="../css/paginas/historial.css">
</head>
<body>

  <div class="dashboard-container">
    <aside id="sidebar-container"></aside>

    <div class="dashboard-main">
      <header id="navbar-container"></header>

      <main class="dashboard-content">
        <section class="historial-contenedor">

          <div class="historial-encabezado">
            <h1>Historial</h1>
            <p>Revisa tu progreso y actividad reciente.</p>
          </div>

          <!-- Resumen rápido -->
          <div class="historial-resumen">
            <div class="resumen-card">
              <span class="resumen-numero" id="hist-completadas">0</span>
              <span class="resumen-etiqueta">Tareas completadas</span>
            </div>
            <div class="resumen-card">
              <span class="resumen-numero" id="hist-racha">0</span>
              <span class="resumen-etiqueta">Racha actual</span>
            </div>
            <div class="resumen-card">
              <span class="resumen-numero" id="hist-horas">0h</span>
              <span class="resumen-etiqueta">Horas de estudio</span>
            </div>
          </div>

          <!-- Lista de actividad -->
          <div class="historial-lista">
            <h2>Actividad reciente</h2>
            <div id="lista-historial">
              <div class="historial-vacio">
                <p>Aún no hay actividad registrada.</p>
              </div>
            </div>
          </div>

        </section>
      </main>
    </div>
  </div>

  <script type="module" src="../js/componentes/sidebar.js"></script>
  <script type="module" src="../js/componentes/navbar.js"></script>
  <script type="module" src="../js/paginas/historial.js"></script>
</body>
</html>
