<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Tarea | LUMI</title>

  <!-- Estilos globales -->
  <link rel="stylesheet" href="../css/global/reset.css">
  <link rel="stylesheet" href="../css/global/variables.css">
  <link rel="stylesheet" href="../css/global/global.css">

  <!-- Componentes -->
  <link rel="stylesheet" href="../css/componentes/sidebar.css">
  <link rel="stylesheet" href="../css/componentes/navbar.css">
  <link rel="stylesheet" href="../css/componentes/botones.css">

  <!-- Estilos de esta página -->
  <link rel="stylesheet" href="../css/paginas/agregar-tarea.css">
</head>
<body>

  <div class="dashboard-container">

    <!-- Sidebar -->
    <aside id="sidebar-container"></aside>

    <!-- Contenido principal -->
    <div class="dashboard-main">

      <!-- Navbar -->
      <header id="navbar-container"></header>

      <!-- Contenido de la página -->
      <main class="dashboard-content">

        <div class="agregar-tarea-wrapper">

          <!-- COLUMNA IZQUIERDA: FORMULARIO MAQUETADO -->
          <div class="columna-formulario">
            
            <!-- Encabezado con Botón de Regreso -->
            <div class="agregar-tarea-encabezado">
              <a href="dashboard.html" class="btn-regresar" aria-label="Volver al dashboard">
              </a>
              <div>
                <h1>Nueva tarea</h1>
                <p>Organiza tu próximo objetivo de estudio</p>
              </div>
            </div>

            <!-- Formulario -->
            <form id="formulario-tarea" class="formulario-tarea">

              <!-- Título de la tarea -->
              <div class="campo">
                <input 
                  type="text" 
                  id="titulo" 
                  name="titulo" 
                  placeholder="Título del trabajo (Ej: Trabajo de flutter / Proyecto final)"
                  required
                >
              </div>

              <!-- Descripción o Rúbrica -->
              <div class="campo campo-descripcion">
                <textarea 
                  id="descripcion" 
                  name="descripcion" 
                  rows="5"
                  placeholder="Descripción o rúbrica...."
                ></textarea>
                <button type="button" class="btn-adjuntar" aria-label="Adjuntar archivo">
                  <span>+</span>
                </button>
              </div>

              <!-- Selector de Fecha Límite -->
              <div class="campo-fecha-banner">
                <div class="icono-calendario">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                  </svg>
                </div>
                <label for="fecha" class="fecha-label">Fecha Límite:</label>
                <input type="date" id="fecha" name="fecha" required>
              </div>

              <!-- Campos de configuración secundarios -->
              <div class="campo-grupo-secundario">
                <div class="campo">
                  <label for="prioridad">Prioridad *</label>
                  <select id="prioridad" name="prioridad" required>
                    <option value="Alta">Alta</option>
                    <option value="Media" selected>Media</option>
                    <option value="Baja">Baja</option>
                  </select>
                </div>

                <div class="campo">
                  <label for="estado">Estado inicial</label>
                  <select id="estado" name="estado">
                    <option value="Sin empezar">Sin empezar (0%)</option>
                    <option value="En progreso">En progreso (40%)</option>
                    <option value="Casi listo">Casi listo (75%)</option>
                    <option value="Completada">Completada (100%)</option>
                  </select>
                </div>
              </div>

              <!-- Botón Generar Cronograma -->
              <div class="contenedor-btn-submit">
                <button type="submit" class="btn-generar-cronograma">
                  Generar cronograma
                </button>
              </div>

            </form>

          </div>

          <!-- COLUMNA DERECHA: MASCOTA Y BOCADILLO DE DIÁLOGO -->
          <div class="columna-mascota">
            <div class="wrapper-mascota4">
              <img src="../assets/consejo_tarea.png" alt="Mascota Lumi IA" class="mascota4-img">
            </div>
          </div>

        </div>

      </main>

    </div>

  </div>

  <!-- Scripts -->
  <script type="module" src="../js/componentes/sidebar.js"></script>
  <script type="module" src="../js/componentes/navbar.js"></script>
  <script type="module" src="../js/paginas/agregar-tarea.js"></script>

  <script type="module" src="../js/componentes/tema.js"></script>
</body>
</html>
