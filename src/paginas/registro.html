<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crea una cuenta en LUMI - Tu compañero inteligente de estudio.">
    <title>Registro | LUMI</title>

    <!-- Estilos globales -->
    <link rel="stylesheet" href="../css/global/reset.css">
    <link rel="stylesheet" href="../css/global/variables.css">
    <link rel="stylesheet" href="../css/global/global.css">

    <!-- Estilos de la página -->
    <link rel="stylesheet" href="../css/paginas/registro.css">
</head>

<body>

    <main class="registro">

        <!-- LADO IZQUIERDO: Presentación y Mascota -->
        <section class="registro-presentacion">

            <div class="registro-brand">
                <img src="../assets/logo-lumi.png" alt="Logo LUMI" class="logo-lumi-img">
                <p class="registro-subtitulo-logo">ESTUDIA <span>MEJOR</span>. LOGRA <span>MÁS</span></p>
            </div>

            <!-- Personaje 3D con Badge de características -->
            <div class="registro-mascota-contenedor">
                <div class="badge-caracteristica">
                    <span class="icono-shield">🛡️</span>
                    <p>Crea tu cuenta y empieza a organizar tu estudio con <strong>Lumi</strong>.</p>
                </div>
                <img src="../assets/mascota2-lumi.png" alt="Mascota inteligente LUMI" class="mascota-img">
            </div>

        </section>


        <!-- LADO DERECHO: Formulario en Card -->
        <section class="registro-formulario-seccion">

            <div class="card-registro">

                <div class="formulario-encabezado">
                    <h2>Registra tu Cuenta</h2>
                    <p>Completa los datos para crear tu cuenta</p>
                </div>

                <form id="formulario-registro">

                    <!-- Nombre y Apellido en 2 Columnas -->
                    <div class="fila-doble">
                        <div class="campo">
                            <label for="nombre">Nombre</label>
                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                autocomplete="given-name"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="apellido">Apellido</label>
                            <input
                                type="text"
                                id="apellido"
                                name="apellido"
                                autocomplete="family-name"
                                required
                            >
                        </div>
                    </div>

                    <div class="campo">
                        <label for="correo">Email</label>
                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="contrasena">Contraseña</label>
                        <input
                            type="password"
                            id="contrasena"
                            name="contrasena"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="confirmar-contrasena">Confirmar tu contraseña</label>
                        <input
                            type="password"
                            id="confirmar-contrasena"
                            name="confirmar-contrasena"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <!-- Aceptar Términos -->
                    <label class="aceptar-terminos">
                        <input type="checkbox" id="terminos" name="terminos" required>
                        <span>Acepto los <a href="#">términos y condiciones</a> y la <a href="#">política de privacidad</a>.</span>
                    </label>

                    <button type="submit" class="boton-registro">
                        Crear cuenta
                    </button>

                </form>

                <!-- Separador Social -->
                <div class="separador">
                    <span>O registrate con</span>
                </div>

                <!-- Botones de Redes Sociales -->
                <div class="social-registro">
                    <button type="button" class="btn-social btn-google">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                        <span>Google</span>
                    </button>

                    <button type="button" class="btn-social btn-microsoft">
                        <img src="https://www.svgrepo.com/show/448239/microsoft.svg" alt="Microsoft">
                        <span>Microsoft</span>
                    </button>
                </div>

                <!-- Redirección a Login -->
                <div class="registro-login">
                    <p>¿Ya tienes cuenta? <a href="./login.html">Inicia sesión</a></p>
                </div>

            </div>

        </section>

    </main>

    <script type="module" src="../js/paginas/registro.js"></script>

    <script type="module" src="../js/componentes/tema.js"></script>
</body>
</html>
