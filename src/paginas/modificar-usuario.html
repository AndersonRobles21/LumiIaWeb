<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Completa y modifica tu perfil en LUMI."
    >

    <title>Detalle de usuario | LUMI</title>

    <!-- ESTILOS GLOBALES -->

    <link
        rel="stylesheet"
        href="../css/global/reset.css"
    >

    <link
        rel="stylesheet"
        href="../css/global/variables.css"
    >

    <link
        rel="stylesheet"
        href="../css/global/global.css"
    >

    <!-- ESTILOS DE LA PÁGINA -->

    <link
        rel="stylesheet"
        href="../css/paginas/modificar-usuario.css"
    >

</head>


<body>

    <main class="dashboard-content" id="detalle-usuario">

        <!-- ENCABEZADO -->

        <section class="perfil-presentacion">

            <div class="perfil-fondo"></div>

            <div class="perfil-contenido">

                <div class="logo-lumi">
                    <span>L</span>
                </div>

                <p class="perfil-etiqueta">ADMINISTRACIÓN</p>

                <h1>
                    Detalle de usuario
                </h1>

                <p class="perfil-descripcion">
                    Consulta y gestiona la información de este usuario.
                </p>

            </div>

        </section>


        <!-- FORMULARIO -->

        <section class="perfil-formulario">

            <div class="formulario-contenedor">

                <div class="formulario-encabezado">

                    <p class="formulario-etiqueta">USUARIO SELECCIONADO</p>

                    <h2 id="detalle-titulo">Cargando información...</h2>

                    <p>
                        Edita el nombre o elimina la cuenta desde este panel.
                    </p>

                </div>


                <form id="formulario-usuario">

                    <!-- NOMBRE -->

                    <div class="campo">

                        <label for="nombre">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Nombre del usuario"
                            required
                        >

                    </div>


                    <div class="campo"><p id="detalle-correo"></p><p id="detalle-objetivo"></p><p id="detalle-racha"></p><p id="detalle-tareas"></p><p id="detalle-horarios"></p><p id="detalle-planes"></p></div>


                    <!-- BOTÓN -->

                    <button
                        type="submit"
                        class="boton-guardar"
                    >

                        <span>GUARDAR NOMBRE</span>

                    </button>

                </form>
                <a href="usuarios.html">Volver a la lista de usuarios</a>
                <button type="button" class="boton-peligro" id="eliminar-usuario">Eliminar usuario</button>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="../js/paginas/modificar-usuario.js"
    ></script>

</body>

</html>
