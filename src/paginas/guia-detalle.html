<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan de Estudio | LUMI</title>

  <!-- Estilos globales -->
  <link rel="stylesheet" href="../css/global/reset.css">
  <link rel="stylesheet" href="../css/global/variables.css">
  <link rel="stylesheet" href="../css/global/global.css">
  <link rel="stylesheet" href="../css/componentes/sidebar.css">
  <link rel="stylesheet" href="../css/componentes/navbar.css">
</head>
<body>

  <div class="dashboard-container">
    <aside id="sidebar-container"></aside>

    <div class="dashboard-main">
      <header id="navbar-container"></header>

      <main class="dashboard-content">
        <div class="contenedor-plan-estudio">

          <!-- Encabezado del Plan -->
          <div class="plan-header">
            <a href="dashboard.html" class="btn-regresar">&#60; Volver al Dashboard</a>
            <h1 id="plan-titulo">Cargando plan de estudio...</h1>
            <p id="plan-descripcion"></p>
          </div>

          <!-- Selector / Cambio de Método de Estudio -->
          <div class="plan-metodo-box">
            <span>Método sugerido por IA:</span>
            <strong id="metodo-actual-nombre">Cargando...</strong>
            <button id="btn-cambiar-metodo" type="button">⚡ Cambiar método</button>
          </div>

          <!-- Pasos a paso generados por la IA -->
          <section class="plan-pasos">
            <h2>Pasos para completar tu objetivo</h2>
            <div id="lista-pasos-container">
              <!-- Aquí el JS inyectará los pasos automáticamente -->
            </div>
          </section>

          <!-- Botón de Enfoque Rápido (Modo Rayo ⚡) -->
          <div class="plan-acciones-footer">
            <button id="btn-modo-rayo" class="btn-rayo-enfoque">
              ⚡ Iniciar Sesión de Enfoque Rápido
            </button>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script type="module" src="../js/componentes/sidebar.js"></script>
  <script type="module" src="../js/componentes/navbar.js"></script>
  <script type="module" src="../js/paginas/guia-detalle.js"></script>
</body>
</html>
